name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API service'
        required: false
        default: 'true'
        type: boolean
      deploy_web:
        description: 'Deploy Web service'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_WEB: ${{ github.repository }}/web

jobs:
  # Build and test (reuse from CI workflow)
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run ktlint check
      run: ./gradlew ktlintCheck
    
    - name: Run API tests
      run: ./gradlew :api:test
    
    - name: Build API module
      run: ./gradlew :api:build
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package.json
    
    - name: Install dependencies
      working-directory: ./web
      run: |
        rm -rf node_modules dist package-lock.json
        npm install
    
    - name: Run lint check
      working-directory: ./web
      run: npm run lint
    
    - name: Build web module
      working-directory: ./web
      run: npm run build

  # Build and push Docker images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for API
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Extract metadata for Web
      id: meta-web
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push API Docker image
      if: github.event.inputs.deploy_api != 'false'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./api/Dockerfile
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Web Docker image
      if: github.event.inputs.deploy_web != 'false'
      uses: docker/build-push-action@v5
      with:
        context: ./web
        file: ./web/Dockerfile
        push: true
        tags: ${{ steps.meta-web.outputs.tags }}
        labels: ${{ steps.meta-web.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy API to Render
  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.deploy_api != 'false'
    environment: render

    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Render
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_API_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}
        wait-for-success: true
    
    - name: Verify API deployment
      run: |
        echo "Waiting for API service to be ready..."
        sleep 30
        
        # Health check (replace with your actual health endpoint)
        curl -f ${{ secrets.RENDER_API_URL }}/health || exit 1
        echo "✅ API deployed successfully"

  # Deploy Web to Render
  deploy-web:
    name: Deploy Web to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.deploy_web != 'false'
    environment: render

    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Render
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}
        wait-for-success: true
    
    - name: Verify Web deployment
      run: |
        echo "Waiting for Web service to be ready..."
        sleep 30
        
        # Health check
        curl -f ${{ secrets.RENDER_WEB_URL }} || exit 1
        echo "✅ Web deployed successfully"

  # Post-deployment verification
  verify-deployment:
    name: Verify Full Deployment
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    if: always() && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') && (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped')
    environment: render

    steps:
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-api.result }}" == "success" ]; then
          echo "✅ **API Service**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ secrets.RENDER_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:main-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy-api.result }}" == "skipped" ]; then
          echo "⏭️ **API Service**: Skipped" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **API Service**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-web.result }}" == "success" ]; then
          echo "✅ **Web Service**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ secrets.RENDER_WEB_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:main-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy-web.result }}" == "skipped" ]; then
          echo "⏭️ **Web Service**: Skipped" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Web Service**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployed at**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # Rollback on failure
  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    if: failure() && (needs.deploy-api.result == 'failure' || needs.deploy-web.result == 'failure')
    environment: render

    steps:
    - name: Rollback API service
      if: needs.deploy-api.result == 'failure'
      run: |
        echo "⚠️  Manual rollback required for API service"
        echo "Service ID: ${{ secrets.RENDER_API_SERVICE_ID }}"
        echo "Please rollback manually in Render dashboard"
    
    - name: Rollback Web service
      if: needs.deploy-web.result == 'failure'
      run: |
        echo "⚠️  Manual rollback required for Web service"
        echo "Service ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}"
        echo "Please rollback manually in Render dashboard"
    
    - name: Notify rollback
      run: |
        echo "🚨 Deployment failed. Automatic rollback initiated."
        echo "Failed services:"
        if [ "${{ needs.deploy-api.result }}" == "failure" ]; then
          echo "- API Service"
        fi
        if [ "${{ needs.deploy-web.result }}" == "failure" ]; then
          echo "- Web Service"
        fi

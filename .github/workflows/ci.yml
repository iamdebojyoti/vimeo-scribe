name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run ktlint check
      run: ./gradlew ktlintCheck

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install dependencies
      working-directory: ./web
      run: npm ci
    
    - name: Run lint check
      working-directory: ./web
      run: npm run lint

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run API tests
      run: ./gradlew :api:test
    
    - name: Parse Test Results
      id: test-results
      if: success() || failure()
      run: |
        echo "::group::Parsing test results"
        find . -name "TEST-*.xml" -exec echo "Found test file: {}" \;
        
        total_tests=$(find . -name "TEST-*.xml" -exec grep -o 'tests="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum}')
        failures=$(find . -name "TEST-*.xml" -exec grep -o 'failures="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum}')
        errors=$(find . -name "TEST-*.xml" -exec grep -o 'errors="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum}')
        
        echo "total-tests=$total_tests" >> $GITHUB_OUTPUT
        echo "failures=$failures" >> $GITHUB_OUTPUT
        echo "errors=$errors" >> $GITHUB_OUTPUT
        
        echo "::endgroup::"
    
    - name: Test Summary
      if: success() || failure()
      run: |
        echo "## 🧪 API Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Tests**: ${{ steps.test-results.outputs.total-tests }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Failures**: ${{ steps.test-results.outputs.failures }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Errors**: ${{ steps.test-results.outputs.errors }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.test-results.outputs.failures }}" -gt 0 ] || [ "${{ steps.test-results.outputs.errors }}" -gt 0 ]; then
          echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        fi

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install dependencies
      working-directory: ./web
      run: npm ci
    
    - name: Run web tests
      working-directory: ./web
      run: npm run test:run

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build API module
      run: ./gradlew :api:build

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package.json
    
    - name: Clean and install dependencies
      working-directory: ./web
      run: |
        rm -rf node_modules dist package-lock.json
        npm install
    
    - name: Build web module
      working-directory: ./web
      run: npm run build

